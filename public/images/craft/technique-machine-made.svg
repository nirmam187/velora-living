<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Diagram of machine weaving: a precisely repeated grid of identical stitches">
  <rect width="200" height="200" fill="#EAE1CE"/>

  <defs>
    <!-- One stitch, repeated exactly. The point of the machine loom is that every
         repeat is identical, so the whole field is a single tiled unit. -->
    <pattern id="stitch" width="24" height="24" patternUnits="userSpaceOnUse">
      <line x1="12" y1="0" x2="12" y2="24" stroke="#8B4A3C" stroke-width="4.4" opacity="0.8"/>
      <line x1="0" y1="12" x2="24" y2="12" stroke="#B08A3E" stroke-width="4.4"/>
      <rect x="9.5" y="9.5" width="5" height="5" fill="#EAE1CE"/>
    </pattern>
  </defs>

  <rect x="20" y="20" width="160" height="160" fill="url(#stitch)"/>

  <!-- Registration marks at the corners — the machine's exact repeat. -->
  <g stroke="#1A1815" stroke-width="1.6" opacity="0.55" fill="none">
    <path d="M20 34V20h14"/>
    <path d="M166 20h14v14"/>
    <path d="M180 166v14h-14"/>
    <path d="M34 180H20v-14"/>
  </g>

  <!-- Repeat measure, drawn once across a single unit. -->
  <g stroke="#B08A3E" stroke-width="1.2" opacity="0.9">
    <line x1="20" y1="190" x2="44" y2="190"/>
    <line x1="20" y1="186" x2="20" y2="194"/>
    <line x1="44" y1="186" x2="44" y2="194"/>
  </g>
</svg>
