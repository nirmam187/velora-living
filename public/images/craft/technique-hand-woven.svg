<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Diagram of hand weaving: weft yarns passing over and under the warp on a loom">
  <rect width="200" height="200" fill="#EAE1CE"/>

  <!-- Warp: the fixed threads held under tension on the loom. -->
  <g stroke="#8B4A3C" stroke-width="7" opacity="0.85" stroke-linecap="butt">
    <line x1="40" y1="24" x2="40" y2="176"/>
    <line x1="72" y1="24" x2="72" y2="176"/>
    <line x1="104" y1="24" x2="104" y2="176"/>
    <line x1="136" y1="24" x2="136" y2="176"/>
    <line x1="168" y1="24" x2="168" y2="176"/>
  </g>

  <!-- Weft: passed by hand, alternating over and under the warp on each pass.
       Each row is drawn as segments so the interlacing reads correctly. -->
  <g stroke="#B08A3E" stroke-width="8" stroke-linecap="butt">
    <g>
      <line x1="16" y1="48" x2="44" y2="48"/>
      <line x1="68" y1="48" x2="108" y2="48"/>
      <line x1="132" y1="48" x2="172" y2="48"/>
    </g>
    <g>
      <line x1="36" y1="76" x2="76" y2="76"/>
      <line x1="100" y1="76" x2="140" y2="76"/>
      <line x1="164" y1="76" x2="188" y2="76"/>
    </g>
    <g>
      <line x1="16" y1="104" x2="44" y2="104"/>
      <line x1="68" y1="104" x2="108" y2="104"/>
      <line x1="132" y1="104" x2="172" y2="104"/>
    </g>
    <g>
      <line x1="36" y1="132" x2="76" y2="132"/>
      <line x1="100" y1="132" x2="140" y2="132"/>
      <line x1="164" y1="132" x2="188" y2="132"/>
    </g>
  </g>

  <!-- Loom beams, top and bottom. -->
  <g stroke="#1A1815" stroke-width="2.4" opacity="0.75">
    <line x1="10" y1="24" x2="190" y2="24"/>
    <line x1="10" y1="176" x2="190" y2="176"/>
  </g>
</svg>
