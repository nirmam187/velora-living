  <path d="M24 46 L34 15" fill="none" stroke="#B08A3E" stroke-width="3.4" stroke-linecap="butt"/>
  <path d="M33 13 L33 47 L52 47" fill="none" stroke="#1A1815" stroke-width="6" stroke-linecap="butt" stroke-linejoin="miter"/>
